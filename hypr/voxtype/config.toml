# Voxtype configuration (https://github.com/peteonrails/voxtype)

state_file = "auto"
engine = "whisper"

[hotkey]
enabled = false
mode = "toggle"

[audio.feedback]
enabled = true

[whisper]
model = "large-v3-turbo"
language = "en"
on_demand_loading = true
flash_attention = true
context_window_optimization = false

[output]
mode = "clipboard"
