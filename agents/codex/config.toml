model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_verbosity = "low"
model_reasoning_summary = "auto"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
check_for_update_on_startup = false
service_tier = "fast"
web_search = "live"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used"]
status_line_use_colors = true

[tui.model_availability_nux]
gpt-6-astra = 100

[tui.keymap.composer]
queue = ["tab", "alt-enter"]

[notice]
fast_default_opt_out = true
hide_rate_limit_model_nudge = true

[desktop]
followUpQueueMode = "steer"
show-context-window-usage = true
open-link-in-target-preference = "external-browser"
open-local-url-in-target-preference = "external-browser"
git-branch-prefix = ""
git-pull-request-merge-method = "squash"
git-create-pull-request-as-draft = false
keepRemoteControlAwakeWhilePluggedIn = true
